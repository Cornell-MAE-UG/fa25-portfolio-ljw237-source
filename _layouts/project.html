---
layout: default
---

<h1>{{ page.title }}</h1>

{% if page.image %}
<img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="project-image" />
{% endif %}

{{ content }}

{% if page.technologies %}
<p><strong>Technologies Used:</strong> {{ page.technologies | join: ", " }}</p>
{% endif %}

<a href="{{ "/projects/" | relative_url }}" class="back-arrow">
  Back to Projects
</a>
